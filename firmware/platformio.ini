; ORC firmware/ — IO-level bring-up/verification sketches only.
; NOT the application firmware. See README.md in this directory.
;
; Board: `esp32-c3-devkitm-1` is a PlatformIO STAND-IN for the actual
; "ESP32-C3 Super Mini"-class board this design targets — no specific
; purchasable listing has been bought yet (see docs/subcircuit-capture-guide.md
; OPEN ARCHITECTURE DECISION). Espressif's devkitm-1 board definition is close
; enough electrically (bare ESP32-C3FN4, 4MB flash, no PSRAM) to compile/flash
; against, but do not treat it as the final hardware declaration.

[platformio]
default_envs = i2c_scanner

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Pin assignment — CORRECTED 2026-08-04 (later same day) against the
; AS-FABBED schematic (U7 ESP32-C3-SuperMini, hardware/mcu.kicad_sch), after
; the board was already sent to fab. The earlier same-day pick below (bit0-3
; = GPIO0/1/3/10) was never what got built -- the real schematic wires
; NODE_ID0..NODE_ID3 to IO0/IO1/IO2/IO3, a contiguous block that INCLUDES
; GPIO2 (a strapping pin) and does NOT use GPIO10 at all. Firmware corrected
; to match reality, not the other way around -- the PCB is not editable.
;   I2C:         SDA = GPIO8,  SCL = GPIO9
;   UART:        TX  = GPIO21, RX  = GPIO20  (to SN65HVD230)
;   CAN address: bit0=GPIO0, bit1=GPIO1, bit2=GPIO2, bit3=GPIO3
;   Spare:       GPIO4-7 (JTAG-default), GPIO10 (unused, contrary to the
;                first same-day plan)
; GPIO9 and GPIO2 are both ESP32-C3 BOOT strapping pins. GPIO9: confirmed
; safe (I2C SCL, see MCU section + README). GPIO2: re-verified safe
; specifically because it's now load-bearing on a fabbed board -- Espressif
; datasheet v2.4 Table 3-3 "Chip Boot Mode Control" shows GPIO2 is
; "Any value" (don't-care) whenever GPIO9=1, and GPIO9=1 is guaranteed at
; every reset by this board's own I2C pull-up (R21, SCL_A). Both address-bank
; switch positions (open=LOW, closed=HIGH on GPIO2) land in the same
; SPI-Boot table row. See firmware/lib/orc_can_addr/orc_can_addr.h and
; README.md for the full citation trail. Not yet confirmed on real hardware
; with the address switches actually wired.
build_flags =
    -D ORC_I2C_SDA_PIN=8
    -D ORC_I2C_SCL_PIN=9
    -D ORC_UART_TX_PIN=21
    -D ORC_UART_RX_PIN=20
    -D ORC_PCA9555_ADDR=0x20
    -D ORC_CAN_ADDR_BIT0_PIN=0
    -D ORC_CAN_ADDR_BIT1_PIN=1
    -D ORC_CAN_ADDR_BIT2_PIN=2
    -D ORC_CAN_ADDR_BIT3_PIN=3
    ; TWAI pins for canopen_app (application firmware, added 2026-08-05) --
    ; same physical GPIO21/GPIO20 as ORC_UART_TX_PIN/RX_PIN above, but given
    ; separate ORC_TWAI_* names deliberately: uart_can_bringup and
    ; canopen_app drive genuinely different on-chip peripherals (UART1 vs
    ; the native TWAI controller) on the same pins, per
    ; docs/can-protocol-research.md's UART-vs-TWAI resolution (TWAI has no
    ; dedicated IO_MUX pin -- it's GPIO-Matrix-routable to any GPIO, so this
    ; is a firmware peripheral change, zero schematic impact). Reusing the
    ; UART-named constant in canopen_app would misleadingly read as if that
    ; sketch were still UART-based.
    -D ORC_TWAI_TX_PIN=21
    -D ORC_TWAI_RX_PIN=20
    ; Real-hardware finding, 2026-08-01: this board definition does NOT set
    ; USB-CDC-on-boot, so Arduino's default `Serial` (console) object binds
    ; to UART0 on GPIO21(TX)/GPIO20(RX) -- the SAME pins this design assigns
    ; to the CAN-transceiver UART -- instead of the native USB-Serial/JTAG
    ; port. Without these flags, console output goes out GPIO21 (nowhere,
    ; on a board with nothing wired there) instead of over USB, and a real
    ; product build would have the debug console and the CAN UART fighting
    ; over the same physical pins. Force Serial onto native USB explicitly.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Each bring-up sketch is a separate, individually-flashable environment.
; `pio run -e <env> -t upload` builds and flashes only that one sketch.

[env:i2c_scanner]
build_src_filter = -<*> +<i2c_scanner/>

[env:pca9555_bringup]
build_src_filter = -<*> +<pca9555_bringup/>

[env:uart_can_bringup]
build_src_filter = -<*> +<uart_can_bringup/>

[env:can_address_bringup]
build_src_filter = -<*> +<can_address_bringup/>

; canopen_app is ORC's first APPLICATION firmware (real CANopen relay
; control), not another bring-up sketch -- see firmware/README.md and
; .claude/can-application-firmware-prompt.md. The four bring-up environments
; above are kept as-is, still separately buildable/flashable.
[env:canopen_app]
build_src_filter = -<*> +<canopen_app/>

; usb_bench is a second piece of APPLICATION firmware (real relay I/O over a
; USB-serial bench interface), per docs/usb-bench-interface-spec.md and
; docs/features/FR-001.md -- not a bring-up sketch, not a replacement for
; canopen_app. Uses the same I2C pins/PCA9555 address from [env] above; no
; new build flags needed (no CAN/TWAI involvement at all -- see the spec's
; "Transport" section).
[env:usb_bench]
build_src_filter = -<*> +<usb_bench/>
